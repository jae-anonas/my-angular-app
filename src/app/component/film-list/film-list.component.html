<div class="film-list-search mb-4">
  <form (ngSubmit)="onSearch()" class="d-flex align-items-center gap-2">
    <input type="text" class="form-control" placeholder="Search films..." [(ngModel)]="searchTerm" name="searchTerm">
    <button type="submit" class="btn btn-primary">Search</button>
  </form>
</div>
<div class="film-list-container">
  <div class="film-cards">
    <div class="film-card" *ngFor="let film of films">
      <a [routerLink]="['/film', film.film_id]" class="film-link-overlay" title="View Details"></a>
      <div class="film-image" [ngStyle]="{'background': getRandomGradient(film.film_id)}">
        <span class="film-image-icon">🎬</span>
      </div>
      <div class="film-title-row">
        <div class="film-title">{{ film.title }}</div>
      </div>
      <div class="film-meta">
        <span>{{ film.release_year }}</span> •
        <span>{{ film.rating }}</span> •
        <span *ngIf="film.categories?.length; else noCategories">{{ film.categories[0].name }}</span>
        <ng-template #noCategories><span class="no-categories">No categories</span></ng-template>
      </div>
      <div class="film-description">{{ film.description }}</div>
      <div class="film-details">
        <span>Length: {{ film.length }} min</span>
        <span>Rental: ${{ film.rental_rate }}</span>
      </div>
    </div>
  </div>
  <nav class="pagination-nav" *ngIf="totalPages > 1">
    <ul class="pagination justify-content-center">
      <li class="page-item" [class.disabled]="page === 1">
        <button class="page-link" (click)="setPage(page - 1)" [disabled]="page === 1">Previous</button>
      </li>
      <li class="page-item" *ngIf="page > 3">
        <button class="page-link" (click)="setPage(1)">1</button>
      </li>
      <li class="page-item disabled" *ngIf="page > 4">
        <span class="page-link">...</span>
      </li>
      <li class="page-item" *ngFor="let p of getVisiblePages()" [class.active]="page === p">
        <button class="page-link" (click)="setPage(p)">{{ p }}</button>
      </li>
      <li class="page-item disabled" *ngIf="page < totalPages - 3">
        <span class="page-link">...</span>
      </li>
      <li class="page-item" *ngIf="page < totalPages - 2">
        <button class="page-link" (click)="setPage(totalPages)">{{ totalPages }}</button>
      </li>
      <li class="page-item" [class.disabled]="page === totalPages">
        <button class="page-link" (click)="setPage(page + 1)" [disabled]="page === totalPages">Next</button>
      </li>
    </ul>
  </nav>
</div>
