<nav class="main-navbar minimal-navbar">
  <div class="navbar-content">
    <div class="navbar-logo">
      <span>🌙</span>
      <span class="navbar-title">MyApp</span>
    </div>
    <ul class="navbar-links navbar-links-left">
      <li *ngIf="!isAdmin"><a routerLink="/home" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Home</a></li>
      <li><a routerLink="/films" routerLinkActive="active">Films</a></li>
      <li *ngIf="!isAdmin"><a routerLink="/active-rentals" routerLinkActive="active">My Rentals</a></li>
      <li *ngIf="isAdmin"><a routerLink="/user-list" routerLinkActive="active">Accounts</a></li>
      <li *ngIf="isAdmin"><a routerLink="/inventory" routerLinkActive="active">Inventory</a></li>
      <li *ngIf="isAdmin"><a routerLink="/add-film" routerLinkActive="active">Add Film</a></li>
      <li *ngIf="isAdmin"><a routerLink="/admin-rentals" routerLinkActive="active">Rentals</a></li>
    </ul>
    <div class="navbar-icons">
      <!-- Customer Information for non-admin users -->
      <div *ngIf="!isAdmin && customerInfo" class="customer-info">
        <span class="customer-name">{{ customerInfo.first_name }} {{ customerInfo.last_name }}</span>
      </div>
      
      <a class="navbar-cart" routerLink="/cart" title="View Cart">
        <span class="cart-icon">🛒</span>
        <span class="cart-badge" *ngIf="cartCount > 0">{{ cartCount }}</span>
      </a>
      <div class="navbar-profile dropdown" tabindex="0" (blur)="showDropdown=false">
        <div class="profile-icon" (click)="showDropdown=!showDropdown">
          <span>👤</span>
        </div>
        <div class="profile-dropdown" *ngIf="showDropdown">
          <a (click)="onProfile()">Profile</a>
          <a (click)="onLogout()">Logout</a>
        </div>
      </div>
    </div>
  </div>
</nav>
<main class="main-content minimal-content" [class.wide-content]="isWideContentPage">
  <router-outlet></router-outlet>
</main>
