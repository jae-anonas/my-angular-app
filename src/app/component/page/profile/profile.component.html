<div class="profile-container">
  <div class="profile-card">
    <div class="profile-avatar">
      <span>👤</span>
    </div>
    <div class="profile-title">User Profile</div>
    <form *ngIf="user" (ngSubmit)="saveProfile()" class="profile-details">
      <div>
        <strong>Username:</strong>
        <span *ngIf="!editMode">{{ user?.username || user?.name || 'N/A' }}</span>
        <input *ngIf="editMode" [(ngModel)]="editedUser.name" name="username" class="form-control form-control-sm" />
      </div>
      <div *ngIf="user?.email">
        <strong>Email:</strong>
        <span *ngIf="!editMode">{{ user.email }}</span>
        <input *ngIf="editMode" [(ngModel)]="editedUser.email" name="email" class="form-control form-control-sm" />
      </div>
      <div *ngIf="user?.first_name">
        <strong>First Name:</strong>
        <span *ngIf="!editMode">{{ user.first_name }}</span>
        <input *ngIf="editMode" [(ngModel)]="editedUser.first_name" name="first_name" class="form-control form-control-sm" />
      </div>
      <div *ngIf="user?.last_name">
        <strong>Last Name:</strong>
        <span *ngIf="!editMode">{{ user.last_name }}</span>
        <input *ngIf="editMode" [(ngModel)]="editedUser.last_name" name="last_name" class="form-control form-control-sm" />
      </div>
      <div *ngIf="user?.role">
        <strong>Role:</strong>
        <span *ngIf="!editMode">{{ user.role }}</span>
        <select *ngIf="editMode" [(ngModel)]="editedUser.role" name="role" class="form-select form-select-sm">
          <option value="user">User</option>
          <option value="admin">Admin</option>
        </select>
      </div>
      <div *ngIf="user?.created_at">
        <strong>Created At:</strong> {{ user.created_at | date:'medium' }}
      </div>
      <div *ngIf="user?.updated_at">
        <strong>Updated At:</strong> {{ user.updated_at | date:'medium' }}
      </div>
      <div *ngIf="user?.id">
        <strong>ID:</strong> {{ user.id }}
      </div>
      <div class="mt-3 w-100 d-flex justify-content-end" *ngIf="!editMode">
        <button type="button" class="btn btn-outline-light btn-sm" (click)="enableEdit()">Edit</button>
      </div>
      <div class="mt-3 w-100 d-flex justify-content-end gap-2" *ngIf="editMode">
        <button type="submit" class="btn btn-primary btn-sm">Save</button>
        <button type="button" class="btn btn-secondary btn-sm" (click)="cancelEdit()">Cancel</button>
      </div>
    </form>
  </div>
</div>
